<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RedNova — Donor Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="text-slate-900 min-h-screen flex flex-col antialiased selection:bg-rose-500 selection:text-white">
  
  <!-- Header -->
  <header class="bg-white/95 backdrop-blur-md border-b border-slate-200 sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2.5 group font-heading font-extrabold text-lg text-slate-900 min-h-[44px]">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-rose-600 to-rose-500 flex items-center justify-center text-white shadow-md shadow-rose-200 group-hover:scale-105 transition-transform">
          <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M3.172 5.172a4 4 0 015.656 0L10 6.343l1.172-1.171a4 4 0 115.656 5.656L10 17.657l-6.828-6.829a4 4 0 010-5.656z" clip-rule="evenodd"></path>
          </svg>
        </div>
        <span class="logo-text">Red<span class="text-rose-500">Nova</span></span>
      </a>
      <div id="nav-auth-container" class="flex items-center gap-2"></div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 max-w-md mx-auto w-full px-4 py-8 sm:py-14">
    <div class="dashboard-container rounded-2xl p-5 sm:p-8 mb-8">
      <div class="mb-6 text-center">
        <div class="w-12 h-12 rounded-2xl bg-rose-100 text-rose-600 flex items-center justify-center mx-auto mb-3 shadow-sm">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
        </div>
        <h1 class="text-2xl sm:text-3xl font-black text-slate-900 font-heading">Donor Portal Login</h1>
        <p class="text-xs sm:text-sm text-slate-600 mt-1">Enter your registered phone number to restore your donor dashboard and incoming requests.</p>
      </div>

      <!-- Login Form -->
      <form id="login-form" class="space-y-4">
        <div>
          <label for="login-phone" class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">Registered Phone Number</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500 font-mono text-sm font-bold">
              +91
            </div>
            <input type="tel" id="login-phone" name="phone" required placeholder="9876543210" class="search-input w-full pl-12 pr-3.5 py-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-rose-500 focus:border-transparent text-sm font-mono placeholder-slate-400 font-medium transition-all min-h-[44px]">
          </div>
        </div>

        <div id="login-error-msg" class="hidden p-3 rounded-xl bg-rose-50 border border-rose-200 text-xs text-rose-800 font-semibold"></div>

        <button type="submit" id="btn-login-submit" class="w-full py-3.5 px-4 rounded-xl bg-rose-600 hover:bg-rose-700 text-white font-bold shadow-lg shadow-rose-200 active:scale-[0.99] transition-all text-sm flex items-center justify-center gap-2 min-h-[48px]">
          <span>Log In to Dashboard</span>
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
        </button>
      </form>

      <!-- Quick Demo 1-Click Login List -->
      <div class="mt-8 pt-6 border-t border-slate-100">
        <div class="flex items-center justify-between mb-3">
          <span class="text-xs font-bold uppercase tracking-wider text-slate-500">Quick Demo Accounts</span>
          <span class="text-[11px] text-slate-400">1-click switch</span>
        </div>
        <div class="space-y-2 max-h-48 overflow-y-auto pr-1" id="quick-donor-list">
          <!-- Populated dynamically from localStorage donors -->
        </div>
      </div>

      <div class="mt-6 pt-4 border-t border-slate-100 text-center text-xs text-slate-600">
        New donor? <a href="register.html" class="text-rose-700 font-bold hover:underline inline-flex items-center min-h-[44px] px-1">Register your profile</a>
      </div>
    </div>
  </main>

  <!-- Footer with Reset Demo Data Button -->
  <footer>
    <button 
      type="button" 
      data-action="reset-demo" 
      class="reset-btn inline-flex items-center justify-center gap-1.5 px-4 py-2 rounded-xl bg-indigo-950/60 hover:bg-indigo-900/80 text-white font-bold border border-rose-500/30 transition-all min-h-[44px] min-w-[44px] active:scale-95 shadow-sm"
      title="Clear localStorage and restore initial seed donors & sample requests">
      <svg class="w-4 h-4 text-rose-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
      <span>Reset Demo Data</span>
    </button>
  </footer>

  <!-- Scripts -->
  <script src="js/db.js"></script>
  <script src="js/app.js"></script>
  <script>
    function renderQuickLoginButtons() {
      const donors = window.DB.getDonors();
      const container = document.getElementById('quick-donor-list');
      if (!container) return;

      container.innerHTML = donors.map(d => `
        <button type="button" onclick="quickLogin('${d.id}')" class="demo-account-card w-full text-left p-3 rounded-xl flex items-center justify-between group min-h-[44px]">
          <div class="flex items-center gap-2.5">
            <span class="w-7 h-7 rounded-lg bg-rose-950/80 text-rose-300 border border-rose-500/40 font-black text-xs flex items-center justify-center font-heading">
              ${d.bloodType}
            </span>
            <div>
              <h4 class="name font-bold text-xs leading-tight">${d.name}</h4>
              <p class="details text-[10px] font-mono">${d.phone} • ${d.locationName.split(',')[0]}</p>
            </div>
          </div>
          <span class="text-xs text-rose-400 font-bold group-hover:translate-x-0.5 transition-transform">Log In →</span>
        </button>
      `).join('');
    }

    function quickLogin(donorId) {
      const donor = window.DB.getDonorById(donorId);
      if (donor) {
        window.DB.setSession(donor.id);
        window.AppUtils.showToast(`Logged in as ${donor.name} (${donor.bloodType})`, 'success');
        setTimeout(() => {
          window.location.href = 'profile.html';
        }, 400);
      }
    }

    document.getElementById('login-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const phoneInput = document.getElementById('login-phone').value.trim();
      const errorMsg = document.getElementById('login-error-msg');
      
      errorMsg.classList.add('hidden');

      const donor = window.DB.getDonorByPhone(phoneInput);

      if (donor) {
        window.DB.setSession(donor.id);
        window.AppUtils.showToast(`Welcome back, ${donor.name}!`, 'success');
        setTimeout(() => {
          window.location.href = 'profile.html';
        }, 400);
      } else {
        errorMsg.textContent = `No registered donor found with phone "${phoneInput}". Please verify the number or register as a new donor.`;
        errorMsg.classList.remove('hidden');
        window.AppUtils.showToast('Donor not found. Please register.', 'error');
      }
    });

    document.addEventListener('DOMContentLoaded', () => {
      renderQuickLoginButtons();
    });
  </script>
</body>
</html>
